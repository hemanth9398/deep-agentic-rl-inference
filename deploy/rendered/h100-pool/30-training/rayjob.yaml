apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: swarmrl-rl
  namespace: rl
  labels:
    kueue.x-k8s.io/queue-name: rl
    kueue.x-k8s.io/priority-class: rl-train
  annotations:
    swarmrl.dev/stage: 3_async
    swarmrl.dev/layout: TP4 PP1 CP2 DP1 EP8 ETP1 EDP1
spec:
  entrypoint: ENGINES=$(swarmrl pool-endpoints --namespace inference --selector app.kubernetes.io/name=rollout-pool --port
    8000) && python3 /root/slime/train.py --actor-num-nodes 1 --actor-num-gpus-per-node 8 --rollout-external-engine-addrs
    $ENGINES --update-weight-transport nccl --tensor-model-parallel-size 4 --pipeline-model-parallel-size 1 --context-parallel-size
    2 --transformer-impl transformer_engine --use-distributed-optimizer --overlap-grad-reduce --overlap-param-gather --attention-backend
    auto --cross-entropy-loss-fusion --use-dynamic-batch-size --max-tokens-per-gpu 16384 --sequence-parallel --expert-model-parallel-size
    8 --expert-tensor-parallel-size 1 --moe-grouped-gemm --moe-permute-fusion --moe-router-dtype fp32 --moe-token-dispatcher-type
    alltoall --recompute-granularity full --recompute-method uniform --recompute-num-layers 1 --bf16 --hf-checkpoint /models/hf/Qwen3-30B-A3B
    --load /models/torch_dist/Qwen3-30B-A3B --ref-load /models/torch_dist/Qwen3-30B-A3B --save /models/rl/Qwen3-30B-A3B --save-interval
    20 --prompt-data /models/tasks/slime-train.jsonl --input-key prompt --label-key label --metadata-key metadata --rollout-shuffle
    --num-rollout 200 --rollout-batch-size 32 --n-samples-per-prompt 16 --num-steps-per-rollout 1 --rollout-max-response-len
    8192 --rollout-temperature 1.0 --rollout-top-p 1.0 --advantage-estimator grpo --eps-clip 0.2 --eps-clip-high 0.28 --calculate-per-token-loss
    --clip-grad 1.0 --lr 1e-06 --custom-generate-function-path swarmrl.integrations.slime.generate --custom-reward-post-process-path
    swarmrl.integrations.slime.reward_post_process --rollout-function-path slime.rollout.fully_async_rollout.generate_rollout_fully_async
    --use-tis --tis-clip 2.0 --custom-tis-function-path slime.backends.megatron_utils.loss.icepop_function --tis-clip-low
    0.5
  runtimeEnvYAML: '{"env_vars": {"PYTHONPATH": "/root/Megatron-LM", "CUDA_DEVICE_MAX_CONNECTIONS": "1", "NVTE_FWD_LAYERNORM_SM_MARGIN":
    "16", "NVTE_BWD_LAYERNORM_SM_MARGIN": "16", "TORCH_NCCL_AVOID_RECORD_STREAMS": "1", "SWARMRL_SLIME_CONFIG": "/etc/swarmrl/slime.json",
    "SWARMRL_LOG_JSON": "1"}}'
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  submissionMode: K8sJobMode
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        dashboard-host: 0.0.0.0
        num-gpus: '0'
      template:
        spec:
          serviceAccountName: swarmrl-rollout
          containers:
          - name: ray-head
            image: ghcr.io/your-org/swarmrl-slime:0.1.0
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: '8'
                memory: 32Gi
              limits:
                memory: 32Gi
            env:
            - name: SWARMRL_SLIME_CONFIG
              value: /etc/swarmrl/slime.json
            - name: SWARMRL_LOG_JSON
              value: '1'
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
            volumeMounts:
            - name: models
              mountPath: /models
            - name: swarmrl-config
              mountPath: /etc/swarmrl
              readOnly: true
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
          volumes:
          - name: models
            persistentVolumeClaim:
              claimName: models
          - name: swarmrl-config
            configMap:
              name: swarmrl-slime
    workerGroupSpecs:
    - groupName: gpu
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      rayStartParams:
        num-gpus: '8'
      template:
        metadata:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name": "rail0-rl", "namespace": "rl", "interface": "net1"}, {"name": "rail1-rl",
              "namespace": "rl", "interface": "net2"}, {"name": "rail2-rl", "namespace": "rl", "interface": "net3"}, {"name":
              "rail3-rl", "namespace": "rl", "interface": "net4"}, {"name": "rail4-rl", "namespace": "rl", "interface": "net5"},
              {"name": "rail5-rl", "namespace": "rl", "interface": "net6"}, {"name": "rail6-rl", "namespace": "rl", "interface":
              "net7"}, {"name": "rail7-rl", "namespace": "rl", "interface": "net8"}]'
        spec:
          serviceAccountName: swarmrl-rollout
          containers:
          - name: ray-worker
            image: ghcr.io/your-org/swarmrl-slime:0.1.0
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                nvidia.com/gpu: '8'
                cpu: '160'
                memory: 1600Gi
                openshift.io/rail0: '1'
                openshift.io/rail1: '1'
                openshift.io/rail2: '1'
                openshift.io/rail3: '1'
                openshift.io/rail4: '1'
                openshift.io/rail5: '1'
                openshift.io/rail6: '1'
                openshift.io/rail7: '1'
              limits:
                nvidia.com/gpu: '8'
                cpu: '160'
                memory: 1600Gi
                openshift.io/rail0: '1'
                openshift.io/rail1: '1'
                openshift.io/rail2: '1'
                openshift.io/rail3: '1'
                openshift.io/rail4: '1'
                openshift.io/rail5: '1'
                openshift.io/rail6: '1'
                openshift.io/rail7: '1'
            env:
            - name: SWARMRL_SLIME_CONFIG
              value: /etc/swarmrl/slime.json
            - name: SWARMRL_LOG_JSON
              value: '1'
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: NCCL_CROSS_NIC
              value: '0'
            - name: NCCL_IB_QPS_PER_CONNECTION
              value: '2'
            - name: NCCL_NVLS_ENABLE
              value: '1'
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: '1'
            - name: NCCL_IB_ROCE_VERSION_NUM
              value: '2'
            - name: NCCL_IB_GID_INDEX
              value: '3'
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
            volumeMounts:
            - name: models
              mountPath: /models
            - name: swarmrl-config
              mountPath: /etc/swarmrl
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            securityContext:
              capabilities:
                add:
                - IPC_LOCK
          volumes:
          - name: models
            persistentVolumeClaim:
              claimName: models
          - name: swarmrl-config
            configMap:
              name: swarmrl-slime
          - name: dshm
            emptyDir:
