# Generated by `swarmrl deploy render` from profile 'h100-pool'. Edit the profile, not this file.
router:
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v0.11.0
      pullPolicy: IfNotPresent
    pluginsConfigFile: swarmrl-rollout.yaml
    pluginsCustomConfig:
      swarmrl-rollout.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: single-profile-handler
        - type: sglanghttp-parser
        - type: openai-parser
        - type: token-producer
        - type: endpoint-notification-source
        - type: precise-prefix-cache-producer
          parameters:
            tokenProcessorConfig:
              blockSizeTokens: 64
            speculativeIndexing: true
            indexerConfig:
              kvBlockIndexConfig:
                enableMetrics: true
            kvEventsConfig:
              engineType: sglang
              topicFilter: kv@
              concurrency: 8
              discoverPods: true
              podDiscoveryConfig:
                socketPort: 5556
        - type: prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: precise-prefix-cache-producer
        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: max-score-picker
        dataLayer:
          sources:
          - pluginRef: endpoint-notification-source
            extractors:
            - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-scorer
            weight: 3.0
          - pluginRef: kv-cache-utilization-scorer
            weight: 1.0
          - pluginRef: queue-scorer
            weight: 1.0
          - pluginRef: max-score-picker
        requestHandler:
          parsers:
          - pluginRef: sglanghttp-parser
          - pluginRef: openai-parser
    resources:
      requests:
        cpu: '4'
        memory: 8Gi
      limits:
        memory: 16Gi
  inferencePool:
    create: true
    failureMode: FailClose
  modelServers:
    type: sglang
    protocol: http
    targetPorts:
    - number: 8000
    matchLabels:
      app.kubernetes.io/name: rollout-pool
httpRoute:
  create: true
  inferenceGatewayName: rollout-gateway
  requestTimeout: 900s
